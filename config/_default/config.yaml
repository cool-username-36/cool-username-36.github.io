# -- Site Configuration --

baseURL: "https://cool-username-36.github.io/"
defaultContentLanguage: "en"
enableRobotsTXT: true
enableGitInfo: false
paginate: 15
summaryLength: 0
enableEmoji: true

outputs:
  home: ["HTML", "RSS", "searchindex"]

outputFormats:
  searchindex:
    mediaType: "application/json"
    baseName: "index"
    isPlainText: true
    notAlternative: true

module:
  imports:
    - path: "github.com/omegion/hugo-omegion"

caches:
  images:
    dir: :cacheDir/images

